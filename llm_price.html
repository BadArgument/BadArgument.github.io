<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM 等价输出价格计算器</title>
<style>
  :root { --bg: #f5f5f5; --card: #fff; --text: #333; --accent: #2563eb; --red: #dc2626; --green: #16a34a; --border: #ddd; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  .container { max-width: 960px; margin: 0 auto; padding: 20px; }
  h1 { text-align: center; margin-bottom: 24px; font-size: 1.5rem; }
  .card { background: var(--card); border-radius: 10px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 640px) { .grid-2, .grid-4 { grid-template-columns: 1fr; } }
  label { display: block; font-size: .8rem; color: #666; margin-bottom: 4px; }
  input { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: .95rem; }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(37,99,235,.15); }
  .result-row { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
  .result-row:last-child { border-bottom: none; }
  .result-label { font-size: .85rem; color: #555; }
  .result-value { font-weight: 600; font-size: 1.05rem; }
  .result-value.big { font-size: 1.3rem; }
  .savings { font-size: .8rem; color: var(--green); }
  .savings.neg { color: var(--red); }
  .highlight { background: #eff6ff; border-radius: 8px; padding: 12px 16px; }
  .note { font-size: .75rem; color: #999; margin-top: 4px; }
  .plot-container { text-align: center; }
  .plot-container img { max-width: 100%; border-radius: 8px; }
</style>
</head>
<body>

      <div><label>u<sub>h</sub> (缓存命中)</label><input id="uh" type="number" value="0.02" step="any" min="0"></div>
      <div><label>u<sub>m</sub> (缓存未命中)</label><input id="um" type="number" value="1.0" step="any" min="0"></div>
      <div><label>u<sub>o</sub> (输出)</label><input id="uo" type="number" value="2.0" step="any" min="0"></div>
      <div><label>单位</label><input value="CNY / 1M tokens" readonly style="color:#999;background:#fafafa;"></div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px;">请求参数</h3>
    <div class="grid-2">
      <div><label>总 token 数 (M + O)</label><input id="total" type="number" value="1000000" step="any" min="1"></div>
      <div><label>输出 token 数 (O)</label><input id="O" type="number" value="10000" step="any" min="1"></div>
      <div>
        <label>缓存命中 token 数 (M·η)</label>
        <input id="hitTokens" type="number" value="909000" step="any" min="0">
      </div>
      <div>
        <label>优化比例 <em>n</em> (%)</label>
        <input id="nPct" type="number" value="3" step="any" min="-100" max="100">
        <div class="note">正值=优化，负值=恶化</div>
      </div>
    </div>
  </div>

  <!-- 派生值 -->
  <div class="card">
    <div class="result-row">
      <span class="result-label">输入 token 数 M</span>
      <span class="result-value" id="valM">—</span>
    </div>
    <div class="result-row">
      <span class="result-label">缓存命中率 η</span>
      <span class="result-value" id="valEta">—</span>
    </div>
    <div class="result-row">
      <span class="result-label">输入输出比 ρ = M/O</span>
      <span class="result-value" id="valRho">—</span>
    </div>
    <div class="result-row">
      <span class="result-label">缓存缺失率 μ = 1−η</span>
      <span class="result-value" id="valMiss">—</span>
    </div>
    <div class="result-row highlight" style="margin-top:8px;">
      <span class="result-label" style="font-size:.95rem;">期望输出单价 v</span>
      <span class="result-value big" id="valV">—</span>
    </div>
  </div>

  <!-- 优化收益 -->
  <div class="card">
    <h3 style="margin-bottom:12px;">优化收益</h3>
    <div class="grid-2">
      <div style="padding:12px;background:#f0fdf4;border-radius:8px;">
        <div style="font-size:.85rem;color:#555;margin-bottom:4px;">缓存命中率优化 <strong id="lblN">n=3</strong>%</div>
        <div style="font-size:.8rem;color:#888;">缺失率 μ → μ·(1 − n%)</div>
        <div style="margin-top:8px;">
          <span class="result-label">优化后 v'</span>
          <span class="result-value" id="valVcache">—</span>
        </div>
        <div>
          <span class="result-label">Δv</span>
          <span class="result-value savings" id="deltaCache">—</span>
        </div>
      </div>
      <div style="padding:12px;background:#fff7ed;border-radius:8px;">
        <div style="font-size:.85rem;color:#555;margin-bottom:4px;">上下文优化 <strong id="lblN2">n=3</strong>%</div>
        <div style="font-size:.8rem;color:#888;">M → M·(1 − n%)，命中率 η 不变</div>
        <div style="margin-top:8px;">
          <span class="result-label">优化后 v'</span>
          <span class="result-value" id="valVctx">—</span>
        </div>
        <div>
          <span class="result-label">Δv</span>
          <span class="result-value savings" id="deltaCtx">—</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 等值线补偿 -->
  <div class="card">
    <h3 style="margin-bottom:12px;">交叉影响计算</h3>
    <div class="grid-2">
      <div><label>上下文增长 <em>m</em> (%)</label>
        <input id="mPct" type="number" value="0" step="any">
      </div>
      <div><label>命中率增加 <em>h</em> (绝对值%)</label>
        <input id="hPct" type="number" value="0" step="0.01">
      </div>
    </div>
    <div style="margin-top:12px;padding:12px;background:#eff6ff;border-radius:8px;">
      <div class="result-row">
        <span class="result-label">变化后 ρ'</span>
        <span class="result-value" id="valRhoCross">—</span>
      </div>
      <div class="result-row">
        <span class="result-label">变化后 η'</span>
        <span class="result-value" id="valEtaCross">—</span>
      </div>
      <div class="result-row">
        <span class="result-label">变化后 v'</span>
        <span class="result-value big" id="valVcross">—</span>
      </div>
      <div class="result-row">
        <span class="result-label">Δv</span>
        <span class="result-value savings" id="deltaCross">—</span>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

function fmt(n, dec = 2) {
  if (n === undefined || n === null || isNaN(n)) return '—';
  return n.toLocaleString(undefined, { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function fmtPct(n) {
  if (n === undefined || n === null || isNaN(n)) return '—';
  return (n * 100).toFixed(2) + '%';
}
function fmtDelta(n) {
  if (n === undefined || n === null || isNaN(n)) return '—';
  return (n >= 0 ? '+' : '') + n.toFixed(4);
}

function compute() {
  const uh = parseFloat($('uh').value) || 0;
  const um = parseFloat($('um').value) || 0;
  const uo = parseFloat($('uo').value) || 0;
  const total = parseFloat($('total').value) || 0;
  const O = parseFloat($('O').value) || 1;
  const hitTokens = parseFloat($('hitTokens').value) || 0;
  const nPct = parseFloat($('nPct').value) || 0;

  const M = Math.max(0, total - O);
  const eta = M > 0 ? Math.min(1, hitTokens / M) : 0;
  const rho = O > 0 ? M / O : 0;
  const miss = 1 - eta;
  const v = uo + rho * (eta * uh + miss * um);

  $('valM').textContent = fmt(M, 0);
  $('valEta').textContent = fmtPct(eta);
  $('valRho').textContent = fmt(rho);
  $('valMiss').textContent = fmtPct(miss);
  $('valV').textContent = fmt(v, 4);

  $('lblN').textContent = 'n=' + fmt(nPct, 1);
  $('lblN2').textContent = 'n=' + fmt(nPct, 1);

  const factor = 1 - nPct / 100;

  // 优化 1：缺失率 μ → μ·(1 − n%)
  const missNew = miss * factor;
  const etaNew = 1 - missNew;
  const vCache = uo + rho * (etaNew * uh + missNew * um);
  $('valVcache').textContent = fmt(vCache, 4);
  const dc = vCache - v;
  $('deltaCache').textContent = fmtDelta(dc);
  $('deltaCache').className = 'result-value savings' + (dc >= 0 ? ' neg' : '');

  // 优化 2：M → M·(1 − n%)，命中率 η 不变
  const Mnew = M * factor;
  const etaNew2 = eta;
  const rhoNew2 = O > 0 ? Mnew / O : 0;
  const missNew2 = 1 - etaNew2;
  const vCtx = uo + rhoNew2 * (etaNew2 * uh + missNew2 * um);
  $('valVctx').textContent = fmt(vCtx, 4);
  const dctx = vCtx - v;
  $('deltaCtx').textContent = fmtDelta(dctx);
  $('deltaCtx').className = 'result-value savings' + (dctx >= 0 ? ' neg' : '');

  // 交叉影响：M → M·(1 + m%)，η → η + h%
  const mPct = parseFloat($('mPct').value) || 0;
  const hPct = parseFloat($('hPct').value) || 0;
  const Mcross = M * (1 + mPct / 100);
  const etaCross = Math.min(1, Math.max(0, eta + hPct / 100));
  const rhoCross = O > 0 ? Mcross / O : 0;
  const missCross = 1 - etaCross;
  const vCross = uo + rhoCross * (etaCross * uh + missCross * um);
  $('valVcross').textContent = fmt(vCross, 4);
  $('valRhoCross').textContent = fmt(rhoCross);
  $('valEtaCross').textContent = fmtPct(etaCross);
  const dcross = vCross - v;
  $('deltaCross').textContent = fmtDelta(dcross);
  $('deltaCross').className = 'result-value savings' + (dcross >= 0 ? ' neg' : '');
}

['uh','um','uo','total','O','hitTokens','nPct','mPct','hPct'].forEach(id => {
  $(id).addEventListener('input', compute);
});

compute();
</script>
</body>
</html>
